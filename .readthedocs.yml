# .readthedocs.yml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    pre_build:
      # source/developers/ usa autodoc contra el codigo de la aplicacion, que vive
      # en otro repositorio. Sin este checkout conf.py excluye esa seccion y el
      # resto de la documentacion se construye igual.
      - git clone --depth 1 https://github.com/Solvosoft/organilab.git _organilab
      - pip install -r _organilab/requirements.txt
      # source/_extra/capacitacion/img/ no se versiona: se genera aqui. Sin este
      # paso la capacitacion se publicaria sin imagenes.
      - python fix_capacitacion_images.py

sphinx:
  configuration: source/conf.py

python:
  install:
    - requirements: requirements.txt
